
upstream static_servers {
    least_conn;
    server 10.0.0.21:80;
    server 10.0.0.22:80;
    server 10.0.0.23:80;
}

server {
        listen 80;
        server_name qwe.com test.qwe.com beta.qwe.com dev.qwe.com www.qwe.com www2.qwe.com;
 
        # -- Security headers --------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
 
        # -- Proxy defaults (inherited by all location blocks) -----------------
        proxy_http_version          1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";   # required for keepalive to upstreams
        proxy_connect_timeout       10s;
        proxy_send_timeout          30s;
        proxy_read_timeout          30s;
        proxy_next_upstream         error timeout http_502 http_503 http_504;
 
 
        location / {
            proxy_pass http://static_servers;
        }
 
        # ── Health check endpoint (internal use) ──────────────────────────────
        location /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny  all;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
 
    }
